name: Feature request
description: An idea for something kube-outlier should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Keep in mind the tool is strictly read-only.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you've tried.
