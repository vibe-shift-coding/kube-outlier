version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
  settings:
    revive:
      rules:
        # CLAUDE.md: document every exported identifier.
        - name: exported
          arguments:
            # ownership.OwnershipVerdict and friends are frozen in
            # docs/interfaces.md; renaming them only to avoid stutter isn't worth it.
            - disableStutteringCheck
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
